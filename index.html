<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='12' fill='%23f2b705'/%3E%3Cpath d='M4 15c3-3 5 1 8-1s4-3 8-1' stroke='%23fff' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Slaice — Platform Mockup</title>
    <meta name="theme-color" content="#f6f8fb" />
    <meta name="description" content="Slaice — a modern, multitenant beach-experience SaaS platform. Book sunbeds, tickets and more on a live beach map." />
    <!-- First paint (AENR-820): the guest site starts on the sea, not a white page. Before the app
         has loaded, mark the guest persona from the saved demo state so the CSS paints the page in
         the beach's sea colours; the app then keeps <html data-persona> in sync. -->
    <script>
      try {
        var h = location.hash, s = JSON.parse(localStorage.getItem("slaice.v1") || "{}");
        if (h.indexOf("#/pass") === 0 || h.indexOf("#/customer") === 0 || (h.indexOf("#/") !== 0 && s.persona === "customer"))
          document.documentElement.dataset.persona = "customer";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
